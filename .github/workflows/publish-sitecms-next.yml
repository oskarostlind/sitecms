name: Publicera sitecms-next till npm

# Publicerar automatiskt när packages/sitecms-next ändras på main och
# versionen i package.json ännu inte finns på npm. Höj "version" för att släppa
# en ny version. Kan även köras manuellt från Actions-fliken.
# Kräver secret NPM_TOKEN (granular access token med publish-rätt).
on:
  push:
    branches: [main]
    paths:
      - "packages/sitecms-next/**"
      - ".github/workflows/publish-sitecms-next.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance (repot är publikt)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sitecms-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Finns versionen redan på npm?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version finns redan på npm — inget att publicera."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publicerar $name@$version."
          fi
      - if: steps.check.outputs.publish == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.check.outputs.publish == 'true'
        run: npm run build
      - if: steps.check.outputs.publish == 'true'
        name: Kontrollera att NPM_TOKEN finns
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::Secret NPM_TOKEN saknas. Lägg den under Settings → Secrets and variables → Actions → Repository secrets."; exit 1; }
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
