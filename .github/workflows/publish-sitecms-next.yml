name: Publicera sitecms-next till npm

# Körs när en tagg "sitecms-next-v1.2.3" pushas, eller manuellt från Actions-fliken.
# Kräver repo-secret NPM_TOKEN (granular access token med publish-rätt).
on:
  push:
    tags:
      - "sitecms-next-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest/next)"
        required: false
        default: "latest"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sitecms-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Kontrollera att taggen matchar package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "sitecms-next-v${v}" ] || { echo "Taggen ${GITHUB_REF_NAME} matchar inte version ${v}"; exit 1; }
      - run: npm publish --access public --provenance --tag "${{ github.event.inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
